name: Read-Only Production Smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'netlify/**'
      - 'scripts/smoke-production-readonly.mjs'
      - '.github/workflows/production-readonly-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readonly-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public production GET routes and unauthenticated function rejection
        run: node scripts/smoke-production-readonly.mjs
      - name: Upload redacted-only status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-readonly-smoke-report
          path: smoke-report/production-readonly.json
          if-no-files-found: warn
          retention-days: 14

name: Validate Inventory App

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:steps6-14
      - run: npm run functions:esm
      - run: npm test
      - run: npm run lint
      - run: npm run build

name: Validate supplier catalog photos
on:
  push:
    branches: [feature/supplier-image-coverage-20261030]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify official product image feeds
        run: node scripts/probe-supplier-pages.mjs && node scripts/verify-vendor-photo-candidates.mjs

name: Marketing school flyer visual fixtures

on:
  pull_request:
    paths:
      - 'src/lib/marketingProgramPdf.js'
      - 'src/MarketingProgramDesigner.jsx'
      - 'src/MarketingDocumentStudio.jsx'
      - 'scripts/render-marketing-flyer-fixtures.mjs'
      - '.github/workflows/marketing-school-flyer-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/render-marketing-flyer-fixtures.mjs
      - run: node_modules/.bin/esbuild src/lib/marketingProgramPdf.js --bundle --platform=node --format=esm --target=node22 --outfile=artifacts/marketing-flyers/marketingProgramPdf.bundle.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: school-flyer-layout-samples
          path: artifacts/marketing-flyers/*
          if-no-files-found: error

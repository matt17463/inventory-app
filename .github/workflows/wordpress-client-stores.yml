name: WordPress Client Stores Plugin
on:
  push:
    paths:
      - "wordpress/skilled-crafting-client-stores/**"
      - "scripts/tests/wordpress-storefront-runtime.php"
      - ".github/workflows/wordpress-client-stores.yml"
  pull_request:
    paths:
      - "wordpress/skilled-crafting-client-stores/**"
      - "scripts/tests/wordpress-storefront-runtime.php"
      - ".github/workflows/wordpress-client-stores.yml"
  workflow_dispatch:

jobs:
  php-lint-and-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check WordPress PHP plugin
        run: php -l wordpress/skilled-crafting-client-stores/skilled-crafting-client-stores.php
      - name: Exercise checkout authorization and category rules
        run: php scripts/tests/wordpress-storefront-runtime.php
      - name: Package installable WordPress plugin
        run: |
          cd wordpress
          zip -r ../skilled-crafting-client-stores.zip skilled-crafting-client-stores/
          unzip -t ../skilled-crafting-client-stores.zip
      - name: Upload WordPress installation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: skilled-crafting-client-stores-wordpress-plugin
          path: skilled-crafting-client-stores.zip
          retention-days: 30

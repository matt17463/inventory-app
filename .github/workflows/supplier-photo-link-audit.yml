name: Supplier photo source diagnostic
on:
  push:
    branches:
      - fix/blank-guide-photos-20261030
  workflow_dispatch:
jobs:
  verify-supplier-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify supplier images for missing blank variants
        run: node scripts/catalog-photo-fetch.mjs

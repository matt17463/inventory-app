name: Client Graphics Branch Verification
on:
  push:
    branches:
      - feature/client-graphics-production-rules-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Client graphics unit tests
        run: npm run test:client-graphics
      - name: Lint complete application
        run: npm run lint
      - name: Compile Vite application
        run: npm run build:vite
      - name: Validate PHP syntax
        run: php -l wordpress/skilled-crafting-graphic-choices/skilled-crafting-graphic-choices.php

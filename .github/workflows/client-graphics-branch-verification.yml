name: Client Graphics Branch Verification
on:
  push:
    branches:
      - feature/client-graphics-production-rules-20261025
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Client graphics unit tests
        run: npm run test:client-graphics
      - name: Lint changed graphics modules
        run: npx eslint src/ClientGraphics.jsx src/OrderGraphicAssignment.jsx src/ProductionTravelers.jsx src/ManufacturingRecipes.jsx src/lib/clientGraphicsRules.js src/lib/graphicCompatibility.js src/lib/travelerGraphicReadiness.js src/lib/wooGraphicSelection.js src/lib/orderGraphicSelection.js netlify/functions/client-graphics.js netlify/functions/order-graphic-selection.js netlify/functions/traveler-graphic-selections.js netlify/functions/_shared/wooGraphicReconciliation.js
      - name: Compile Vite application
        run: npm run build:vite
      - name: Validate PHP syntax
        run: php -l wordpress/skilled-crafting-graphic-choices/skilled-crafting-graphic-choices.php

name: Client Graphics Isolated Integration
on:
  push:
    branches: [feature/client-graphics-production-rules-20261025, feature/woo-client-graphics-integration-20261026, feature/woo-binding-approval-isolated-e2e-20261026, feature/woo-graphics-production-hardening-20261026]
    paths:
      - 'scripts/integration/client-graphics/**'
      - 'wordpress/skilled-crafting-graphic-choices/**'
      - 'supabase/migrations/20261025*.sql'
      - 'supabase/migrations/202610260001_generic_recipe_line_artwork.sql'
      - 'supabase/migrations/202610260002_woo_binding_review.sql'
      - 'netlify/functions/woo-graphic-binding-review.js'
      - 'netlify/functions/job-line-placement-artwork.js'
      - 'netlify/functions/*graphic*.js'
      - 'netlify/functions/_shared/wooGraphic*.js'
      - 'netlify/functions/traveler-artwork-preflight.js'
      - 'netlify/functions/_shared/mockupStorage.js'
      - 'src/ProductionTravelers.jsx'
      - 'scripts/tests/mockup-studio.test.mjs'
      - 'src/lib/*Graphic*.js'
      - '.github/workflows/client-graphics-isolated-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/integration/client-graphics/**'
      - 'wordpress/skilled-crafting-graphic-choices/**'
      - 'netlify/functions/_shared/wooGraphic*.js'
      - 'netlify/functions/woocommerce-webhook.js'
      - 'src/lib/wooGraphicSelection.js'
      - '.github/workflows/client-graphics-isolated-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm ci --prefix scripts/integration/client-graphics
      - name: Exercise actual traveler RPC and simulated integration handlers
        shell: bash
        env:
          CG_TESTED_SHA: ${{ github.sha }}
          CG_RESULTS: ${{ github.workspace }}/integration-results.json
        run: node --experimental-test-module-mocks scripts/integration/client-graphics/verify.mjs 2>&1 | tee integration.log
      - name: Verify enforced storage receipts with actual PostgreSQL triggers
        shell: bash
        run: node scripts/integration/client-graphics/verify-storage-receipts.mjs 2>&1 | tee storage-receipt-integration.log
      - name: Verify actual preflight endpoint against SQL receipt enforcement
        if: always()
        shell: bash
        env:
          CG_STORAGE_RESULTS: ${{ github.workspace }}/storage-endpoint-results.json
        run: node --experimental-test-module-mocks scripts/integration/client-graphics/verify-storage-endpoint.mjs 2>&1 | tee storage-endpoint-integration.log
      - name: Verify isolated Woo approval through checkout and production traveler
        run: node scripts/integration/client-graphics/verify-woo-binding-e2e.mjs
      - name: Verify generic recipe artwork assignments against PostgreSQL
        shell: bash
        run: node scripts/integration/client-graphics/verify-generic-recipes.mjs 2>&1 | tee generic-recipe-integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-graphics-isolated-results
          path: |
            integration-results.json
            integration.log
            storage-receipt-integration.log
            storage-endpoint-integration.log
            storage-endpoint-results.json
            generic-recipe-integration.log
  wordpress-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: php -l wordpress/skilled-crafting-graphic-choices/skilled-crafting-graphic-choices.php
      - name: Verify isolated Woo Blocks Store API selector script
        run: node scripts/integration/client-graphics/verify-block-ui.mjs
      - name: Exercise actual graphic-choice checkout hooks using fictional fixtures
        run: php scripts/integration/client-graphics/wordpress-runtime.php

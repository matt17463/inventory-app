[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.parse_body]
  enabled = false

[functions."google-calendar-scheduled-sync"]
  schedule = "*/15 * * * *"

[functions."mockup-generate-background"]
  background = true

[functions."mockup-publish-woocommerce-background"]
  background = true

[functions."color-lifecycle-background"]
  background = true

[functions."supplier-confirmation-parse"]
  included_files = ["netlify/functions/_vendor/pdfjs/pdf.worker.mjs", "netlify/functions/_vendor/pdfjs/LICENSE"]

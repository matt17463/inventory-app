[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.parse_body]
  enabled = false

[functions."google-calendar-scheduled-sync"]
  schedule = "*/15 * * * *"

[functions."mockup-generate-background"]
  background = true

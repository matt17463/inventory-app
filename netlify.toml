[build]
  ignore = "node ./scripts/netlify-ignore-non-production.mjs"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.parse_body]
  enabled = false

[functions."google-calendar-scheduled-sync"]
  schedule = "*/15 * * * *"

[functions."mockup-generate-background"]
background = true

[functions."mockup-generate-exact-background"]
background = true

[functions."mockup-publish-woocommerce-background"]
  background = true

[functions."color-lifecycle-background"]
  background = true

[functions."supplier-receiving-background"]
  background = true

[functions."supplier-confirmation-parse"]
  included_files = ["netlify/functions/_vendor/pdfjs/pdf.worker.mjs", "netlify/functions/_vendor/pdfjs/LICENSE"]

# Web research runs can exceed normal function execution; Netlify acknowledges a job
# while clients read RLS-protected progress from Supabase.
[functions."product-discovery-run-background"]
  background = true

[functions."dtf-ai-guidance-background"]
  background = true

# Page-level text indexing uses the vetted PDF.js runtime already bundled for supplier receiving.
[functions."knowledge-manual-admin"]
  included_files = ["netlify/functions/_vendor/pdfjs/pdf.worker.mjs", "netlify/functions/_vendor/pdfjs/LICENSE"]

[functions."knowledge-manual-sync"]
  included_files = ["netlify/functions/_vendor/pdfjs/pdf.worker.mjs", "netlify/functions/_vendor/pdfjs/LICENSE"]
